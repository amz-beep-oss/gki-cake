name: Build CAKE for Android 15 6.6.89

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Configure Git Identity
        run: |
          git config --global user.name "Build Bot"
          git config --global user.email "buildbot@github.com"

      - name: Install Repo Tool
        run: |
          sudo curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

      - name: Initialize Repo and Sync Android 15 6.6 Kernel
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6
          repo sync -c -j$(nproc) --no-clone-bundle
          
          # CRITICAL FIX: Lock to the EXACT commit hash running on your phone to match symbol CRCs
          cd common
          git fetch https://android.googlesource.com/kernel/common 8e4be6b47e40
          git checkout 8e4be6b47e40

      - name: Enable CAKE in Correct Position in Config
        run: |
          python3 -c '
          path = "android-kernel/common/arch/arm64/configs/gki_defconfig"
          with open(path, "r") as f:
              lines = f.readlines()
          lines = [l for l in lines if "CONFIG_NET_SCH_CAKE" not in l]
          new_lines = []
          inserted = False
          for line in lines:
              new_lines.append(line)
              if not inserted and line.startswith("CONFIG_NET_SCH_FQ_CODEL="):
                  new_lines.append("CONFIG_NET_SCH_CAKE=m\n")
                  inserted = True
          if not inserted:
              new_lines.append("CONFIG_NET_SCH_CAKE=m\n")
          with open(path, "w") as f:
              f.writelines(new_lines)
          '

      - name: Add sch_cake.ko to _COMMON_GKI_MODULES_LIST
        run: |
          python3 -c '
          path = "android-kernel/common/modules.bzl"
          with open(path, "r") as f:
              content = f.read()
          
          target = "_COMMON_GKI_MODULES_LIST = ["
          if target in content:
              content = content.replace(target, target + "\n    \"net/sched/sch_cake.ko\",", 1)
          
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Build with Bazel (Kleaf)
        run: |
          cd android-kernel
          tools/bazel run //common:kernel_aarch64_dist -- --destdir=out/dist

      - name: Patch Vermagic String to Bypass Google Security Checks
        run: |
          python3 -c '
          import sys, re
          
          file_path = "android-kernel/out/dist/sch_cake.ko"
          # The exact vermagic string required by your specific device
          target_vermagic = b"6.6.89-android15-8-g8e4be6b47e40-ab14134548-4k SMP preempt mod_unload modversions aarch64\x00"
          
          with open(file_path, "rb") as f:
              data = f.read()
              
          # Dynamically search for whatever vermagic the compiler spit out (e.g., -maybe-dirty)
          pattern = b"6\.6\.89-android15-8-[^\x00]+\x00"
          match = re.search(pattern, data)
          
          if match:
              old_vermagic = match.group(0)
              print("Found compiled vermagic:", old_vermagic)
              
              if len(target_vermagic) > len(old_vermagic):
                  print("Error: Target vermagic is longer. Cannot safely patch binary.")
                  sys.exit(1)
                  
              # Safely null-pad the new string to match the byte length of the old string
              padded_target = target_vermagic.ljust(len(old_vermagic), b"\x00")
              
              # Overwrite the binary data
              new_data = data[:match.start()] + padded_target + data[match.end():]
              
              with open(file_path, "wb") as f:
                  f.write(new_data)
              print("SUCCESS: Vermagic spoofed safely!")
          else:
              print("Error: Could not find vermagic in the module.")
              sys.exit(1)
          '

      - name: Upload Ready-to-Use sch_cake.ko
        uses: actions/upload-artifact@v4
        with:
          name: sch_cake-android15-6.6
          path: android-kernel/out/dist/sch_cake.ko
