name: Build CAKE for Android 15 6.6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Configure Git Identity
        run: |
          git config --global user.name "Build Bot"
          git config --global user.email "buildbot@github.com"

      - name: Install Repo Tool
        run: |
          sudo curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

      - name: Initialize Repo and Sync Android 15 6.6 Kernel
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b android15-6.6 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Enable CAKE in Config
        run: |
          echo "CONFIG_NET_SCH_CAKE=m" >> android-kernel/common/arch/arm64/configs/gki_defconfig

      - name: Build with Bazel (Kleaf)
        run: |
          cd android-kernel
          tools/bazel run //common:kernel_aarch64_dist -- --destdir=out/dist

      - name: Upload Compiled sch_cake.ko
        uses: actions/upload-artifact@v4
        with:
          name: sch_cake-android15-6.6
          path: android-kernel/out/dist/sch_cake.ko
