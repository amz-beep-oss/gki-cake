name: Build CAKE for Android 15 6.6.89

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Configure Git Identity
        run: |
          git config --global user.name "Build Bot"
          git config --global user.email "buildbot@github.com"

      - name: Install Repo Tool
        run: |
          sudo curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

      - name: Initialize Repo and Sync Android 15 6.6 Kernel
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6
          repo sync -c -j$(nproc) --no-clone-bundle
          
          cd common
          git checkout 8e4be6b47e40

      - name: Enable CAKE in Config
        run: |
          python3 -c '
          path = "android-kernel/common/arch/arm64/configs/gki_defconfig"
          with open(path, "r") as f:
              lines = f.readlines()
          lines = [l for l in lines if "CONFIG_NET_SCH_CAKE" not in l]
          new_lines = []
          inserted = False
          for line in lines:
              new_lines.append(line)
              if not inserted and line.startswith("CONFIG_NET_SCH_FQ_CODEL="):
                  new_lines.append("CONFIG_NET_SCH_CAKE=m\n")
                  inserted = True
          if not inserted:
              new_lines.append("CONFIG_NET_SCH_CAKE=m\n")
          with open(path, "w") as f:
              f.writelines(new_lines)
          '

      - name: Add sch_cake.ko to _COMMON_GKI_MODULES_LIST
        run: |
          python3 -c '
          path = "android-kernel/common/modules.bzl"
          with open(path, "r") as f:
              content = f.read()
          
          target = "_COMMON_GKI_MODULES_LIST = ["
          if target in content:
              content = content.replace(target, target + "\n    \"net/sched/sch_cake.ko\",", 1)
          
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Patch sch_cake.c to Remove Trimmed Dependencies
        run: |
          python3 -c '
          path = "android-kernel/common/net/sched/sch_cake.c"
          with open(path, "r") as f:
              code = f.read()

          # 1. Build a header block with our undefs and our macro definition
          header = "#undef CONFIG_NF_CONNTRACK\n"
          header += "#undef CONFIG_NF_CONNTRACK_MARK\n"
          header += "#include <linux/jhash.h>\n"
          header += "#define my_flow_hash_from_keys(k) jhash(k, sizeof(*(k)), 0x9e3779b9)\n\n"

          # 2. Slap it directly at the absolute top of the file
          code = header + code
          
          # 3. Replace the function calls
          code = code.replace("flow_hash_from_keys(", "my_flow_hash_from_keys(")

          with open(path, "w") as f:
              f.write(code)
          '

      - name: Hijack Kleaf Stamping to Force Custom Vermagic
        run: |
          find android-kernel/build -type f -name "*.bzl" -exec sed -i "s/-maybe-dirty/-g8e4be6b47e40-ab14134548/g" {} +
          find android-kernel/build -type f -name "*.sh" -exec sed -i "s/-maybe-dirty/-g8e4be6b47e40-ab14134548/g" {} +
          find android-kernel/build -type f -name "*.py" -exec sed -i "s/-maybe-dirty/-g8e4be6b47e40-ab14134548/g" {} +

      - name: Build with Bazel (Kleaf)
        run: |
          cd android-kernel
          tools/bazel run //common:kernel_aarch64_dist -- --destdir=out/dist

      - name: Upload Ready-to-Use sch_cake.ko
        uses: actions/upload-artifact@v4
        with:
          name: sch_cake-android15-6.6
          path: android-kernel/out/dist/sch_cake.ko
